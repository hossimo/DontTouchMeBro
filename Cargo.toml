[package]
name = "donttouchmebro"
version = "2.0.0"
edition = "2024"
description = "Tray utility that enables and disables a device by its Device Instance Path"
authors = ["Down Right Technical Inc."]
license-file = "LICENSE"
repository = "https://github.com/hossimo/DontTouchMeBro"
publish = false

# The binary keeps the historical exe name so the installer, the start-at-logon
# scheduled task and existing shortcuts keep working.
[[bin]]
name = "DontTouchMeBro"
path = "src/main.rs"
# main.rs has no tests, and its test harness would inherit the
# requireAdministrator manifest (os error 740 under cargo test).
test = false

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
egui_extras = "0.36.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_Devices_Properties",
] }

[dev-dependencies]
egui_kittest = "0.36.2"
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-dependencies]
embed-resource = "3.0.12"
